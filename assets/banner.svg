<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shelf Wood/Metal Gradient -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#38BDF8" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserScan {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateY(200px); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -32; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-10px) translateX(6px); opacity: 0.7; }
    }
    @keyframes bboxPulse {
      0%, 100% { stroke-opacity: 0.6; stroke-width: 1.5px; }
      50% { stroke-opacity: 1; stroke-width: 2.5px; }
    }
    @keyframes textShimmer {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
      50% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.8)); }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .laser-line { animation: laserScan 3.8s ease-in-out indefinite alternate; }
    .pulse-bg { animation: pulseGlow 5s ease-in-out indefinite; transform-origin: center; }
    .dash-border { stroke-dasharray: 8, 4; animation: dashMove 2.5s linear indefinite; }
    .particle-1 { animation: floatParticle 5s ease-in-out indefinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out indefinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out indefinite 2s; }
    .bbox-active { animation: bboxPulse 2s ease-in-out indefinite; }
    .shimmer-text { animation: textShimmer 4s ease-in-out indefinite; }
    .status-dot { animation: statusBlink 1.4s ease-in-out indefinite; }
    .radar-sweep { animation: radarSpin 8s linear indefinite; transform-origin: 1060px 75px; }
  </style>

  <!-- Base Canvas Outer Frame -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Subtle Background Grid -->
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>

  <!-- Background Ambient Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#38BDF8" opacity="0.08" class="pulse-bg" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="220" fill="#818CF8" opacity="0.08" class="pulse-bg" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="140" fill="#C084FC" opacity="0.05" class="pulse-bg" filter="url(#glow)"/>

  <!-- Floating Tech Particles -->
  <circle cx="120" cy="80" r="3" fill="#38BDF8" class="particle-1"/>
  <circle cx="480" cy="60" r="2.5" fill="#818CF8" class="particle-2"/>
  <circle cx="560" cy="360" r="3.5" fill="#00F2FE" class="particle-3"/>
  <circle cx="80" cy="340" r="2" fill="#C084FC" class="particle-2"/>

  <!-- LEFT SECTION CONTENT -->
  
  <!-- Live Status Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#10B981" class="status-dot"/>
    <text x="30" y="18" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      LIVE RETAIL EXECUTION &amp; VISION ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="60" y="122" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    AWESOME SHELF
  </text>
  <text x="60" y="172" fill="url(#textGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" class="shimmer-text">
    INTELLIGENCE PLATFORM
  </text>

  <!-- Subtitle -->
  <text x="60" y="210" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" width="520">
    Curated SaaS Solutions • Open-Source CV Models • SKU-110K • Planogram Compliance
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(60, 242)">
    <!-- Pill 1: Computer Vision -->
    <g transform="translate(0, 0)">
      <rect width="160" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📷 Computer Vision</text>
    </g>

    <!-- Pill 2: Planogram AI -->
    <g transform="translate(170, 0)">
      <rect width="150" height="32" rx="8" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#818CF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📋 Planograms</text>
    </g>

    <!-- Pill 3: OOS Detection -->
    <g transform="translate(330, 0)">
      <rect width="155" height="32" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚠️ OOS Detection</text>
    </g>

    <!-- Row 2 Pills -->
    <!-- Pill 4: Store Robotics -->
    <g transform="translate(0, 42)">
      <rect width="145" height="32" rx="8" fill="#1E293B" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#C084FC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🤖 Store Robotics</text>
    </g>

    <!-- Pill 5: Share of Shelf -->
    <g transform="translate(155, 42)">
      <rect width="145" height="32" rx="8" fill="#1E293B" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 Share of Shelf</text>
    </g>

    <!-- Pill 6: YOLOv11 -->
    <g transform="translate(310, 42)">
      <rect width="120" height="32" rx="8" fill="#1E293B" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="20" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ YOLOv11</text>
    </g>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 350)">
    <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">
      Enterprise SaaS &amp; Open-Source Projects • Updated 2026
    </text>
  </g>

  <!-- RIGHT SECTION - INTERACTIVE AI SHELF SCANNER WINDOW -->
  <g transform="translate(620, 35)">
    <!-- Window Outer Glass Panel -->
    <rect width="520" height="350" rx="14" fill="url(#glassGradient)" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Window Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 506 0 Q 520 0 520 14 L 520 36 L 0 36 Z" fill="#0F172A"/>
    <circle cx="18" cy="18" r="5" fill="#EF4444"/>
    <circle cx="34" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="18" r="5" fill="#10B981"/>
    
    <text x="70" y="22" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">
      stream_cam_04.ai [YOLO11-SKU • 60 FPS]
    </text>
    
    <rect x="420" y="10" width="85" height="16" rx="4" fill="#1E293B"/>
    <circle cx="430" cy="18" r="3" fill="#10B981" class="status-dot"/>
    <text x="438" y="21" fill="#10B981" font-family="monospace" font-size="9" font-weight="700">AUDIT LIVE</text>

    <!-- SHELF CONTENT AREA (y: 40 to 340) -->
    <!-- Shelf Row 1 -->
    <rect x="25" y="130" width="470" height="6" rx="3" fill="url(#shelfGrad)"/>
    
    <!-- Shelf Row 2 -->
    <rect x="25" y="235" width="470" height="6" rx="3" fill="url(#shelfGrad)"/>
    
    <!-- Shelf Row 3 -->
    <rect x="25" y="330" width="470" height="6" rx="3" fill="url(#shelfGrad)"/>

    <!-- PRODUCTS & BOUNDING BOXES - SHELF 1 -->
    <!-- Product 1: Cereal Box Green -->
    <g transform="translate(45, 55)">
      <rect width="42" height="72" rx="4" fill="#065F46" stroke="#10B981" stroke-width="1"/>
      <rect x="8" y="10" width="26" height="20" rx="2" fill="#34D399" opacity="0.6"/>
      <line x1="8" y1="42" x2="34" y2="42" stroke="#A7F3D0" stroke-width="2"/>
      <line x1="8" y1="48" x2="28" y2="48" stroke="#A7F3D0" stroke-width="2"/>
      <!-- Bounding Box -->
      <rect x="-4" y="-4" width="50" height="80" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
      <rect x="-4" y="-18" width="48" height="14" rx="2" fill="#10B981"/>
      <text x="-1" y="-7" fill="#064E3B" font-family="monospace" font-size="8" font-weight="800">SKU:99.4%</text>
    </g>

    <!-- Product 2: Soda Bottle Red -->
    <g transform="translate(115, 63)">
      <rect width="32" height="64" rx="6" fill="#991B1B" stroke="#EF4444" stroke-width="1"/>
      <rect x="6" y="20" width="20" height="15" rx="1" fill="#FCA5A5" opacity="0.7"/>
      <!-- Bounding Box -->
      <rect x="-4" y="-4" width="40" height="72" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
      <rect x="-4" y="-18" width="46" height="14" rx="2" fill="#10B981"/>
      <text x="-1" y="-7" fill="#064E3B" font-family="monospace" font-size="8" font-weight="800">SKU:98.1%</text>
    </g>

    <!-- Product 3: Can Blue -->
    <g transform="translate(175, 75)">
      <rect width="34" height="52" rx="3" fill="#1E40AF" stroke="#60A5FA" stroke-width="1"/>
      <ellipse cx="17" cy="10" rx="12" ry="4" fill="#93C5FD" opacity="0.6"/>
      <!-- Bounding Box -->
      <rect x="-4" y="-4" width="42" height="60" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <!-- Product 4: Empty Gap (OOS Alert!) -->
    <g transform="translate(240, 55)">
      <rect width="65" height="72" rx="4" fill="#7F1D1D" fill-opacity="0.15" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" class="dash-border"/>
      <text x="12" y="36" fill="#EF4444" font-family="sans-serif" font-size="16" font-weight="800">⚠️</text>
      <text x="8" y="54" fill="#EF4444" font-family="monospace" font-size="9" font-weight="800">EMPTY SLOT</text>
      <!-- Alert Tag -->
      <rect x="2" y="-18" width="61" height="14" rx="2" fill="#EF4444"/>
      <text x="5" y="-7" fill="#FFFFFF" font-family="monospace" font-size="8" font-weight="800">OOS DETECTED</text>
    </g>

    <!-- Product 5: Snack Bag Yellow -->
    <g transform="translate(330, 60)">
      <polygon points="5,0 35,0 40,68 0,68" fill="#B45309" stroke="#FBBF24" stroke-width="1"/>
      <!-- Bounding Box -->
      <rect x="-4" y="-4" width="48" height="74" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
      <rect x="-4" y="-18" width="46" height="14" rx="2" fill="#10B981"/>
      <text x="-1" y="-7" fill="#064E3B" font-family="monospace" font-size="8" font-weight="800">SKU:96.7%</text>
    </g>

    <!-- Product 6: Box Purple -->
    <g transform="translate(405, 50)">
      <rect width="48" height="77" rx="3" fill="#581C87" stroke="#C084FC" stroke-width="1"/>
      <!-- Bounding Box -->
      <rect x="-4" y="-4" width="56" height="84" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <!-- SHELF 2 PRODUCTS -->
    <!-- Product 7: Jar Green -->
    <g transform="translate(45, 160)">
      <rect width="38" height="70" rx="8" fill="#047857" stroke="#34D399" stroke-width="1"/>
      <rect x="-4" y="-4" width="46" height="78" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <!-- Product 8: Juice Carton Orange -->
    <g transform="translate(105, 150)">
      <rect width="44" height="80" rx="2" fill="#C2410C" stroke="#FB923C" stroke-width="1"/>
      <polygon points="0,0 22,-12 44,0" fill="#EA580C"/>
      <rect x="-4" y="-16" width="52" height="100" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
      <rect x="-4" y="-28" width="52" height="14" rx="2" fill="#10B981"/>
      <text x="-1" y="-17" fill="#064E3B" font-family="monospace" font-size="8" font-weight="800">SKU:99.9%</text>
    </g>

    <!-- Product 9: Misplaced SKU (Planogram Violation) -->
    <g transform="translate(180, 165)">
      <rect width="50" height="65" rx="4" fill="#6B21A8" stroke="#A855F7" stroke-width="1"/>
      <rect x="-4" y="-4" width="58" height="73" rx="4" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="4,2"/>
      <rect x="-4" y="-18" width="76" height="14" rx="2" fill="#8B5CF6"/>
      <text x="-1" y="-7" fill="#FFFFFF" font-family="monospace" font-size="8" font-weight="800">MISPLACED ITEM</text>
    </g>

    <!-- Product 10: Detergent Bottle Blue -->
    <g transform="translate(280, 145)">
      <rect width="55" height="85" rx="10" fill="#1D4ED8" stroke="#60A5FA" stroke-width="1"/>
      <rect x="38" y="15" width="22" height="35" rx="6" fill="none" stroke="#60A5FA" stroke-width="4"/>
      <rect x="-4" y="-4" width="70" height="93" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <!-- Product 11: Tea Box Teal -->
    <g transform="translate(370, 160)">
      <rect width="45" height="70" rx="3" fill="#0F766E" stroke="#2DD4BF" stroke-width="1"/>
      <rect x="-4" y="-4" width="53" height="78" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <!-- SHELF 3 PRODUCTS -->
    <g transform="translate(50, 260)">
      <rect width="60" height="65" rx="4" fill="#334155" stroke="#64748B" stroke-width="1"/>
      <rect x="-4" y="-4" width="68" height="73" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <g transform="translate(130, 255)">
      <rect width="50" height="70" rx="4" fill="#334155" stroke="#64748B" stroke-width="1"/>
      <rect x="-4" y="-4" width="58" height="78" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <g transform="translate(200, 260)">
      <rect width="70" height="65" rx="4" fill="#334155" stroke="#64748B" stroke-width="1"/>
      <rect x="-4" y="-4" width="78" height="73" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <g transform="translate(290, 250)">
      <rect width="55" height="75" rx="4" fill="#334155" stroke="#64748B" stroke-width="1"/>
      <rect x="-4" y="-4" width="63" height="83" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <g transform="translate(365, 255)">
      <rect width="65" height="70" rx="4" fill="#334155" stroke="#64748B" stroke-width="1"/>
      <rect x="-4" y="-4" width="73" height="78" rx="4" fill="none" stroke="#10B981" stroke-width="1.5" class="bbox-active"/>
    </g>

    <!-- DYNAMIC SCANNING LASER BEAM EFFECT -->
    <g transform="translate(20, 50)" class="laser-line">
      <!-- Beam Gradient Overlay -->
      <rect x="0" y="-40" width="480" height="40" fill="url(#laserBeam)"/>
      <!-- Bright Laser Beam Line -->
      <line x1="0" y1="0" x2="480" y2="0" stroke="#00F2FE" stroke-width="2.5" filter="url(#laserGlow)"/>
      <!-- Scanning Target Reticle on Laser -->
      <circle cx="240" cy="0" r="6" fill="none" stroke="#00F2FE" stroke-width="1.5"/>
      <circle cx="240" cy="0" r="2" fill="#00F2FE"/>
    </g>

    <!-- HUD Overlay Metrics Footer -->
    <g transform="translate(20, 310)">
      <rect width="480" height="30" rx="6" fill="#090D16" opacity="0.85" stroke="#1E293B" stroke-width="1"/>
      <text x="15" y="19" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">
        COMPLIANCE: 94.2%
      </text>
      <text x="150" y="19" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700">
        SKUs DETECTED: 42/45
      </text>
      <text x="320" y="19" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="700">
        OOS COUNT: 1
      </text>
    </g>

  </g>

</svg>
